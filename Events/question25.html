// Task 23:
// Create:

// 1 input
// 1 h1

// The h1 should start with:
// "Release Any Key"

// When the user RELEASES any key inside the input:

// Change the h1 text to:
// "Key Released!"

// Also change the h1 color to blue.

// Use:
// - keyup event
// - one event listener

// Bonus:
// Instead of "Key Released!",
// show:
// "You released: A"
// "You released: B"
// "You released: Enter"

// Hint:
// You'll need the event object:
//
// inputField.addEventListener("keyup", (e) => {
//
// });
//
// And use:
// e.key

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" class="input-box">
    <h1 class="heading">Release Any Key</h1>

    <script>
        let inputFeild = document.querySelector(".input-box");
        let heading = document.querySelector(".heading");

        inputFeild.addEventListener("keyup", (e) => {

            heading.innerText = "Key Released! " + e.key;
            heading.style.color = "blue";
        })
    </script>
</body>

</html>
