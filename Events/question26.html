<!--

// Task 24:
// Create:

// 1 input
// 1 h1

// The h1 should start with:
// "Waiting..."

// When the user presses a key:
// Change the h1 text to:
// "Key Down"

// Change the h1 color to red.

// When the user releases the key:
// Change the h1 text to:
// "Key Up"

// Change the h1 color to green.

// Use:
// - keydown event
// - keyup event
// - two event listeners

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" class="input-box">
    <h1 class="heading">Waiting...</h1>

    <script>
        let inputFeild = document.querySelector(".input-box");
        let heading = document.querySelector(".heading");

        inputFeild.addEventListener("keydown", () => {
            heading.innerText = "Key Down";
            heading.style.color = "red";
        });

        inputFeild.addEventListener("keyup", () => {
            heading.innerText = "Key Up";
            heading.style.color = "green";
        })
    </script>
</body>

</html>
