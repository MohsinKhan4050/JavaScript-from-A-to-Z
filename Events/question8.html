// Create two buttons and one h1.

// Button 1 → Increase
// Button 2 → Decrease

// Now do this:

// 1. Select both buttons and the h1.
// 2. The h1 should start from 0.
// 3. When you click Increase:
//    - Increase the number by 1.
// 4. When you click Decrease:
//    - Decrease the number by 1.
// 5. Display the updated number inside the h1.

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    button {
        cursor: pointer;
    }

    h1 {
        width: 90px;
        background: red;
        text-align: center;
        color: #fff;
        border-radius: 10px;
        padding: 10px;
    }
</style>

<body>
    <button class="increase-btn">Increase Number</button>
    <button class="decrease-btn">Decrease NUmber</button>
    <h1 class="heading">0</h1>

    <script>

        let increaseBtn = document.querySelector(".increase-btn");
        let decreaseBtn = document.querySelector(".decrease-btn");
        let heading = document.querySelector(".heading");

        let number = 0;

        increaseBtn.addEventListener("click", () => {

            number++;
            heading.innerText = number;

        });

        decreaseBtn.addEventListener("click", () => {
            number--;
            heading.innerText = number;
        })
    </script>
</body>


</html>
