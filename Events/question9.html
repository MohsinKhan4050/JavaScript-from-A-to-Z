<!--

// Task 4:
// Create one button and one div using HTML.

// Now do this:

// 1. Select the button and the div.
// 2. Add a click event on the button.
// 3. Every click should:
//    - Change the div background color.
//    - First click  → red
//    - Second click → blue
//    - Third click  → green
//    - Fourth click → orange
// 4. After orange, start again from red.
// 5. Use an array and a counter variable.
// 6. Do NOT use if-else statements.

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 1px solid #000;
            margin-bottom: 5px;
        }

        .btn {
            cursor: pointer;
        }
    </style>
</head>


<body>
    <div class="box"></div>
    <button class="btn">Change Color</button>

    <script>
        let div = document.querySelector(".box");
        let btn = document.querySelector(".btn");

        let divColors = ["red", "blue", "green", "orange"];
        let count = 0;

        btn.addEventListener("click", () => {

            div.style.backgroundColor = divColors[count];
            count++;

            if (count === divColors.length) {
                count = 0;
            }
        })
    </script>
</body>

</html>
