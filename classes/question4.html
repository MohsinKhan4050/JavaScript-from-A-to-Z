<!--constructor Parameter  -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        // constructor with single parameter

        class Student {

            constructor(name) {
                console.log(name)
            }

        }

        let Student1 = new Student("Mohsin"); //output => Mohsin


        // constructor with multiple parameter

        class Cars {

            constructor(name, model) {
                console.log(name, model)
            }

        }

        let car1 = new Cars("Honda :", 2021);
        let car2 = new Cars("Sozaki :", 2024);
        let car3 = new Cars("Corolla :", 2011);


    </script>
</body>

</html>
