<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <h2>Shopping Cart</h2>

    <ul id="items">
        <li data-price="100">Item 1 - $100</li>
        <li data-price="200">Item 2 - $200</li>
        <li data-price="300">Item 3 - $300</li>
        <li data-price="400">Item 4 - $400</li>

    <button id="btn">Calculate Total</button>

    <h3 id="result"></h3>
</div>

<!-- External JS -->
<script src="script.js"></script>

</body>
</html>
