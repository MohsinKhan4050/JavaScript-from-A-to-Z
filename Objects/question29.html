<!--

Task 29:

Create an object named "car".

The object should have:

brand: "Toyota"
model: "Corolla"
year: 2024

Perform these actions:

1. Print the complete object.
2. Store Object.entries(car) inside a variable named "entries".
3. Print the "entries" variable.
4. Print the first entry.
5. Print the second entry.
6. Print the third entry.

Use:
- Object literal {}
- Object.entries()
- Array indexing

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>

        let car = {
            brand: "Toyota",
            model: "Corolla",
            year: 2024,
        }

        console.log(car);

        let entries = Object.entries(car);
        console.log(entries);

        console.log("The first entries is:", entries[0]);
        console.log("The second entries is:", entries[1]);
        console.log("The third entries is:", entries[2]);
        
    </script>
</body>

</html>
