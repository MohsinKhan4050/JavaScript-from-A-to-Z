<!--

Create an object named "student".

The object should have:

name: "Mohsin"
age: 20

address: {
    city: "Lahore",
    country: "Pakistan"
}

Perform the following actions:

1. Print the complete object.
2. Print the student's name.
3. Print the city.

Use:

- Nested object
- Dot notation

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let student = {
            name: "Mohsin",
            age: 20,


            address: {
                city: "Lahore",
                country: "Pakistan",
            }
        };

        console.log(student);
        console.log(student.name);
        console.log(student.address.city);
        console.log(student.address.country)

    </script>
</body>

</html>
