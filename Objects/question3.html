author: "John"

   price: 500

<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>

        let book = {
            title: "JavaScript Basics",
            author: "John",
            pages: 150,
        }

        console.log(book);
        book.price = 500;
        console.log(book);
        console.log(book.price)
    </script>
