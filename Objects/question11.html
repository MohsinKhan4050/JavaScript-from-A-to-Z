<!--

Task 11:
Create an object named "person".

The object should have:

name: "Ali"
age: 20

Also add a method named "greet".

When the method is called, it should print:

Hello, I am Ali

Perform the following actions:

1. Print the complete object.
2. Call the greet method.

Use:
- Object literal {}
- Function inside object
- Method calling

Hint:

greet: function () {
    console.log("Hello, I am Ali");
}

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>

        let person = {
            name: "Ali",
            age: 20,
            greet: function () {
                console.log("Hello, I am Ali")
            }
        };

        console.log(person);
        person.greet();


    </script>
</body>

</html>
