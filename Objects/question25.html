<!--

Task 25:

Create an object named "book".

The object should have:

title: "JavaScript Guide"
author: "John"
pages: 300

Perform these actions:

1. Print the complete object.
2. Store Object.keys(book) inside a variable named "keys".
3. Print the "keys" variable.
4. Print the first key.
5. Print the second key.
6. Print the third key.

Use:
- Object literal {}
- Object.keys()
- Array indexing

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        let book = {
            title: "JavaScript Guide",
            author: "John",
            pages: 300,
        };

        console.log(book);

        let keys = Object.keys(book);
        console.log(keys);

        console.log(keys[0])

        console.log(keys[1]);

        console.log(keys[2])



    </script>
</body>

</html>
