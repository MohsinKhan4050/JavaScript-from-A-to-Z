<!--

Task 1:
Create an object named "student".

The object should have:

name: "Ali"
age: 18
course: "JavaScript"

Print the following in the console:

1. The complete object.
2. The student's name.
3. The student's course.

Expected Output:

{ name: "Ali", age: 18, course: "JavaScript" }

Ali

JavaScript

Use:
- Object literal {}
- Dot notation

-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        let student = {
            name: "Ali",
            age: 18,
            course: "JavaScript"
        }
        console.log(student);
        console.log(student.name);
        console.log(student.course);

    </script>
</body>

</html>
