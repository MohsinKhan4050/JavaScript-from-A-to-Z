<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>

        let user = {

            id: 1,
            name: "Mohsin",
            isLoggedIn: true,
            skills: ["HTML", "CSS", "JavaScript"],

            address: {
                city: "Lahore",
                country: "Pakistan",
            },

            projects: [

                {
                    name: "Portfolio Website",
                    completed: true,
                },

                {
                    name: "Todo App",
                    completed: false,
                }
            ]
        };

        console.log(user);
        console.log("The user name is:", user.name);
        console.log("The user skills is:", user.skills);

        console.log("the last skill of user is:", user.skills[user.skills.length - 1]) // i used this because use have a lot of skills so everytime configure of index in diffecult;

        console.log(user.address.city);

        console.log(user.projects);

        console.log("the name of first project is:", user.projects[0].name);

        console.log(user.projects[1].completed);

        // add a new skill 
        user.skills.push("React");

        user.address.city = "Karachi";

        user.projects[1].completed = true;

        console.log(user)



    </script>
</body>

</html>
