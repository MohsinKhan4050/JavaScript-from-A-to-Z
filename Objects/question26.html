<!-- Object.values()  => they return the property values-->
<!-- Object.keys()  => they return the property name-->



<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let car = {
            brand: "Toyota",
            model: "Corolla",
            year: 2024
        };

        let values = Object.values(car);
        let name = Object.keys(car)

        
        console.log('The values is', values);
        console.log('The name is', name);


    </script>
</body>

</html>
